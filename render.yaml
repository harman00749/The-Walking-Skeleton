services:
  - type: web
    name: the-walking-skeleton
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build --workspace server
    startCommand: npm run start --workspace server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: STRIPE_SECRET_KEY
        sync: false
